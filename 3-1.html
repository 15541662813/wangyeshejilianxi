<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>306王大军</title>
</head>
<body>
    <h2>HTML表单<form</h2>
    <form action="http://huanqiu.com"name="wdj">
        <p>
           用户名 <input type="text" name="uesername"
        </p>

        <p>
            密码<input type="pasword" name="password"
        </p>

        <p>
            性别<input type="radio" name="sex" value="male">男
            <input type="radio" name="sex" value="female">女
            <!--保密-->
            <input type="radio" name="sex" value="s">保密
        </p>

        <p>
            爱好：<input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">跑步
            <input type="checkbox" name="hobby" value="3">溜达

        </p>

        <!--籍贯-->
        <p>
            籍贯：<select name="jiguan">
                <option value="1">北京 </option>
                <option value="2" selected>辽宁 </option>
                <option value="3">陕西 </option>
                <option value="4">山东 </option>
            </select>
        </p>

        <!--个人简介-->
        <p>
            个人简介：<textarea name="jianje" cols="30" name="birthday"></textarea>
        </p>

         <!--日期-->
        <p>
            出生日期：<input type="date" name="birthday">
        </p>

        <!--多文件上传-->
        <p>
            <input type="file" name="file" multiple>
        </p>

        <!--按钮：普通按钮 提交按钮 重置按钮-->
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
        </p>
    </form>
    <!--按钮button-->
            <button>表单外的按钮</button>
            
    </form>
</body>
</html>

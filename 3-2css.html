<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>306王大军</title>
    <style>
        p{
            color: rgb(236, 149, 221);
            font-size: 50px;
        }
        /*标签选择器*/
        #box{
            width: 600px;
            height: 500px;
            background-color:#ccc;
        }
        .n1{
            color: rgb(68, 236, 236);
        }
        .n2{
            color: rgb(243, 239, 123);
        }
        .n3{
            color: rgb(127, 237, 171);
        }
        h2 {
            color: white;
            background-color: black;
            text-align: center;
            padding: 10px;
        }
        .black-text{
            color: black;
        }
        .new-box{
            width: 300px;
            height: 300px;
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 css</h2>
    <div id="box">
        <p>css<span class="black-text">选择器</span></p>
        <p><span class="n1">王</span><span class="n2">大</span><span class="n3">军</span></p>
        <p>css属性</p>
    </div>
    <div class="new-box"></div>
</body>
</html>

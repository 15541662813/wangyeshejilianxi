<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>王大军</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html {
			font-size: 18px;
		}

		body {
			min-height: 100vh;
			margin: 0;
			font-family: "Microsoft YaHei", sans-serif;
		}

		.viewport-box {
			width: 100%;
			min-height: 100vh;
			min-height: 100svh;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			background-color: #168c82;
			transition: background-color 250ms ease;
		}

		.text-container {
			width: min(42rem, 100%);
			padding: 2.5rem;
			border-radius: 8px;
			background-color: rgb(255 255 255 / 92%);
			color: #202a34;
			text-align: center;
		}

		.text-container h1 {
			margin: 0 0 1rem;
			font-size: 2.5rem;
		}

		.text-container p {
			margin: 0;
			font-size: 1rem;
			line-height: 1.7;
		}

		.viewport-label span {
			display: none;
		}

		.viewport-label .wide {
			display: inline;
		}

		@media (max-width: 900px) {
			html {
				font-size: 17px;
			}

			.viewport-box {
				background-color: #e5aa32;
			}

			.text-container h1 {
				font-size: 2.2rem;
			}

			.viewport-label .wide {
				display: none;
			}

			.viewport-label .tablet {
				display: inline;
			}
		}

		@media (max-width: 600px) {
			html {
				font-size: 16px;
			}

			.viewport-box {
				background-color: #e56b52;
			}

			.text-container {
				padding: 2rem 1.5rem;
			}

			.text-container h1 {
				font-size: 2rem;
			}

			.viewport-label .tablet {
				display: none;
			}

			.viewport-label .phone {
				display: inline;
			}
		}

		@media (max-width: 400px) {
			html {
				font-size: 15px;
			}

			.viewport-box {
				background-color: #5576c7;
			}

			.text-container {
				padding: 1.5rem 1rem;
			}

			.text-container h1 {
				font-size: 1.7rem;
			}

			.viewport-label .phone {
				display: none;
			}

			.viewport-label .compact {
				display: inline;
			}
		}
	</style>
</head>
<body>
	<main class="viewport-box">
		<section class="text-container">
			<h1>王大军</h1>
			<p class="viewport-label">
				当前视口：<span class="wide">宽屏</span><span class="tablet">平板</span><span class="phone">手机</span><span class="compact">小屏手机</span>
			</p>
		</section>
	</main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Animation 幻灯片</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f1f3f5;
			font-family: "Microsoft YaHei", sans-serif;
		}

		.slideshow {
			position: relative;
			width: min(760px, 100%);
			aspect-ratio: 16 / 10;
			overflow: hidden;
			border-radius: 8px;
			background: #fff;
			box-shadow: 0 16px 40px rgb(25 35 45 / 14%);
		}

		.slide {
			position: absolute;
			inset: 0;
			overflow: hidden;
			opacity: 0;
			animation: show-slide 16s infinite;
		}

		.slide:nth-child(1) { animation-delay: 0s; }
		.slide:nth-child(2) { animation-delay: -4s; }
		.slide:nth-child(3) { animation-delay: -8s; }
		.slide:nth-child(4) { animation-delay: -12s; }

		.slide img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.caption {
			position: absolute;
			right: 0;
			bottom: 0;
			left: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			padding: 12px 24px;
			background: rgb(0 0 0 / 55%);
			color: #fff;
			text-align: center;
		}

		.caption h2 {
			margin: 0 0 6px;
			font-size: 22px;
		}

		.caption p {
			margin: 0;
			color: #fff;
			font-size: 14px;
		}

		@keyframes show-slide {
			0%, 24.99% { opacity: 1; }
			25%, 100% { opacity: 0; }
		}

		@media (max-width: 480px) {
			.caption {
				padding: 8px 12px;
			}

			.caption h2 {
				margin-bottom: 4px;
				font-size: 18px;
			}

			.caption p {
				font-size: 12px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.slide {
				animation: none;
			}

			.slide:not(:first-child) {
				display: none;
			}

			.slide:first-child {
				opacity: 1;
			}
		}
	</style>
</head>
<body>
	<main class="slideshow">
		<section class="slide">
			<img src="./img/a.jpg" alt="幻灯片图片一">
			<div class="caption">
				<p>王大军一</p>
			</div>
		</section>
		<section class="slide">
			<img src="./img/b.jpg" alt="幻灯片图片二">
			<div class="caption">
				<p>王大军四</p>
			</div>
		</section>
		<section class="slide">
			<img src="./img/123.jpg" alt="幻灯片图片三">
			<div class="caption">
				<p>王大军三</p>
			</div>
		</section>
		<section class="slide">
			<img src="./img/d.jpg" alt="幻灯片图片四">
			<div class="caption">
				<p>王大军二</p>
			</div>
		</section>
	</main>
</body>
</html>
